name: Build NFC Lab APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -q NfcLab_project.zip -d .

      - name: Fix HCE resource descriptions
        run: |
          mkdir -p NfcLab/app/src/main/res/values
          cat > NfcLab/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="nfc_lab_demo_card">NFC Lab demo card</string>
              <string name="nfc_lab_test_aid">NFC Lab test AID</string>
          </resources>
          EOF
          sed -i 's/android:description="NFC Lab demo card"/android:description="@string\/nfc_lab_demo_card"/' NfcLab/app/src/main/res/xml/hce_service.xml
          sed -i 's/android:description="NFC Lab test AID"/android:description="@string\/nfc_lab_test_aid"/' NfcLab/app/src/main/res/xml/hce_service.xml

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("NfcLab/app/build.gradle"),
              Path("NfcLab/app/build.gradle.kts"),
          ]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("Could not find NfcLab/app/build.gradle or build.gradle.kts")

          if build_file.suffix == ".kts":
              block = """
          
          // Keep Java bytecode target aligned with Kotlin (JVM 17).
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
          else:
              block = """
          
          // Keep Java bytecode target aligned with Kotlin (JVM 17).
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

          content = build_file.read_text()
          if "sourceCompatibility = JavaVersion.VERSION_17" not in content and "sourceCompatibility JavaVersion.VERSION_17" not in content:
              build_file.write_text(content.rstrip() + block + "\n")
          print(f"Aligned Java target in {build_file}")
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p NfcLab assembleDebug

      - name: Inspect APK compatibility and signature
        shell: bash
        run: |
          APK="NfcLab/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          echo "=== APK manifest metadata ==="
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|uses-feature:)"
          echo "=== APK signature verification ==="
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "=== ZIP alignment ==="
          "$ZIPALIGN" -c -v 4 "$APK"
          echo "=== APK file ==="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Lab-debug
          path: NfcLab/app/build/outputs/apk/debug/app-debug.apk
